name: validate

on:
  pull_request:
    paths:
      - ".claude-plugin/**"
      - "plugins/**"
      - "README*.md"
      - "CLAUDE.md"
      - ".github/scripts/*.py"
      - ".github/scripts/*.sh"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  manifests:
    name: Validate plugin manifests & counts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON, arrays, counts, and version consistency
        run: python3 .github/scripts/validate_plugin.py

      - name: Prompt contract checks (paths, agent names, flags, hooks schema)
        run: python3 .github/scripts/check_contracts.py

      - name: Commit gate regression tests (deterministic, no model calls)
        run: bash .github/scripts/test_gate.sh

      - name: Knowledge-wiki boundary tests (scope gate, deny patterns, publish limits)
        run: python3 .github/scripts/test_knowledge_wiki.py

      - name: Prompt surface measurement (reported, non-blocking)
        run: |
          bash .github/scripts/measure.sh HEAD >> "$GITHUB_STEP_SUMMARY" || true
