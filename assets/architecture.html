  <desc id="ed1-desc">Four layers, top to bottom. Commands are the five entry points. Agents are the eleven execution units for requirements, architecture, build teams and review. Skills are the eight reference assets for specs, design systems, diagrams, presentations and shared memory. Hooks sit underneath and enforce outside the prompt, blocking git commit until the gate artifact and objective checks pass.</desc>

      --line:#E6E3EE;  --line-strong:#85819B;
      --accent:#9B51E0; --accent-deep:#6B2EAA;
    }
    svg.ed[data-theme="dark"]{
      --paper:#15151E; --paper-2:#1E1E28;
      --ink:#F5F4FA;   --muted:#A8A6B8;
      --line:#2C2C3A;  --line-strong:#6E6C84;
      --accent:#A85FEA; --accent-deep:#6B2EAA;
    }

    .title    { font-family:"Space Grotesk","Pretendard",sans-serif; font-weight:600;
                font-size:28px; fill:var(--ink); }
    .subtitle { font-family:"Pretendard",sans-serif; font-weight:400;
                font-size:15px; fill:var(--muted); }
    .node-name{ font-family:"Pretendard",sans-serif; font-weight:500;
                font-size:18px; fill:var(--ink); text-anchor:middle; }
    .sublabel { font-family:"JetBrains Mono",monospace; font-weight:400;
                font-size:13px; fill:var(--muted); text-anchor:middle; }
    .foot     { font-family:"JetBrains Mono",monospace; font-weight:400;
                font-size:12px; fill:var(--muted); }
    .start    { text-anchor:start; }
    .end      { text-anchor:end; }

    .node     { fill:var(--paper-2); stroke:var(--line-strong); stroke-width:1; }
    .node.focal{ stroke:var(--accent); stroke-width:2; }
    .dot      { fill:var(--accent); }
    .link     { stroke:var(--line-strong); stroke-width:1.5; fill:none; }
  </style>

  <rect x="0" y="0" width="1280" height="720" fill="var(--paper)"/>

  <text x="64" y="96"  class="title">Plugin architecture</text>
  <text x="64" y="124" class="subtitle">Entry points on top · each layer reads the one below · hooks enforce outside the prompt</text>

  <text class="node-name start" x="88" y="210">Commands (5)</text>
  <text class="sublabel start"  x="88" y="234">/prd → /screen-spec → /implement → /auto-commit · /review-pr</text>

  <rect class="node" x="64" y="296" width="1152" height="96" rx="8"/>
  <text class="node-name start" x="88" y="338">Agents (11)</text>
  <text class="sublabel start"  x="88" y="362">requirements · architecture · build teams (backend / frontend / mobile / ai) · review</text>

  <rect class="node" x="64" y="424" width="1152" height="96" rx="8"/>
  <text class="node-name start" x="88" y="466">Skills (8)</text>
  <text class="sublabel start"  x="88" y="490">screen specs · design systems (20 styles) · diagrams · presentations · shared memory</text>

  <rect class="node focal" x="64" y="552" width="1152" height="96" rx="8"/>
  <circle class="dot" cx="1192" cy="576" r="8"/>
  <text class="node-name start" x="88" y="594">Hooks</text>
  <text class="sublabel start"  x="88" y="618">enforcement outside the prompt — blocks git commit until the gate artifact and checks pass</text>

  <text x="64" y="692" class="foot">generated by the editorial-diagram skill · source: assets/architecture.html</text>
</svg>
